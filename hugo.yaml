baseURL: "https://dominik-wilkowski.com/"
languageCode: en-us
title: Dominik Wilkowski Blog

taxonomies:
  tag: tags
params:
  description: This blog is a chronicle of my (Dominik Wilkowski) ongoing coding adventures and write-ups of tutorials I've given to teams about a technology
  theme: light
  hideHeader: false
  # homeIntroTitle: homepage heading
  # homeIntroContent: homepage intro
  homeCollectionTitle: Posts
  homeCollection: posts
  paginationSize: 100
  listSummaries: true
  listDateFormat: 2 Jan 2006
  breadcrumbs:
    enabled: true
    showCurrentPage: true
    home: Home
  social:
    - name: github
      url: "https://github.com/dominikwilkowski"
    - name: bluesky
      url: "https://bsky.app/profile/dominik-wilkowski.com"
    - name: mastodon
      url: "https://mastodon.social/@wilkowskidom"
    - name: linkedin
      url: "https://www.linkedin.com/in/dominikwilkowski/"
  menu:
    - name: home
      url: /
    - name: posts
      url: /posts
  giscus:
    enable: false
  mermaidTheme: light
  mermaidDarkTheme: light
markup:
  highlight:
    style: monokailight
    tabWidth: 2
    lineNos: true
    noClasses: true
    anchorLineNos: false
    lineNumbersInTable: true
    wrapperClass: highlight
  goldmark:
    renderer:
      unsafe: true
