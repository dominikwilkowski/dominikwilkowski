<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 1200 630">
	<path fill="#FAF8F6" d="M1200 0H0v630h1200V0Z"/>
	{{- $words := split (.Title | plainify | truncate 70 "…") " " -}}
	{{- $line := "" -}}
	{{- $lines := slice -}}
	{{- range $i, $w := $words }}
		{{- $test := printf "%s %s" $line $w | strings.TrimSpace -}}
		{{- if gt (len $test) 25 }}
			{{- $lines = $lines | append $line }}
			{{- $line = $w }}
		{{- else }}
			{{- $line = $test }}
		{{- end }}
	{{- end }}
	{{- $lines = $lines | append $line }}

	<text x="42" y="373" font-size="96" font-family="sans-serif" fill="#181A1C">
		{{- range $i, $l := $lines }}
			{{- if eq $i 0 }}
				<tspan x="42" dy="0">{{ $l }}</tspan>
			{{- else }}
				<tspan x="42" dy="1.1em">{{ $l }}</tspan>
			{{- end }}
		{{- end }}
	</text>

	<text xml:space="preserve" fill="#181A1C" font-family="sans-serif" font-size="12" letter-spacing="0em" style="white-space:pre">
		<tspan x="48" y="285">{{ .Date.Format "Jan 02, 2006" }}</tspan>
	</text>

